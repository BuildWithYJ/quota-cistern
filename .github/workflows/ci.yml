name: ci

on:
  # A title edited after a green run would otherwise keep the stale result.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Without this the action sets -D warnings, which a local run does not.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: ./scripts/check.sh

  # Merges are squashed, so the title is the commit message on main.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore)(\(.+\))?!?: .'
          [[ "$TITLE" =~ $pattern ]] || { echo "not a Conventional Commits title: $TITLE"; exit 1; }
