[workspace]
resolver = "3"
members = ["crates/cistern", "crates/cistern-contract", "crates/cisternd"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/BuildWithYJ/quota-cistern"

[workspace.dependencies]
cistern-contract = { path = "crates/cistern-contract" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
interprocess = "2.4"
# The status line is drawn only where there is a terminal, and only the status
# line carries how much of the vendor's limit is spent.
portable-pty = { version = "0.9", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
toml = "1.1"

# The core runs unattended, so a failure there loses usage that no re-run recovers.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
