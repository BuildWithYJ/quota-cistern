[workspace]
resolver = "3"
members = ["crates/cisternd", "crates/cistern"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/BuildWithYJ/quota-cistern"

# The core runs unattended, so a failure there loses usage that no re-run recovers.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
