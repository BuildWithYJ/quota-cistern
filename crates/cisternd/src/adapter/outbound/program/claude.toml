# Claude Code, as this build calls it.
#
# Everything the vendor names is here. To change one of them, write a file at
# $XDG_CONFIG_HOME/cistern/vendors/claude.toml holding only what differs; it is laid over
# this one, so the rest keeps coming from here and an upgrade brings the improvements with
# it. Copying the whole of this file instead would freeze it at the moment it was copied.
#
#     turns = "100"

program = "claude"

# The goal is a command of the vendor's, and everything written after it is the condition it
# gates on. The vendor holds that condition to 4000 characters.
#
# So the instruction is not written after it. It goes in as a system prompt instead, which
# nothing holds to a length: an instruction of four thousand characters is an ordinary task
# description, and one written after the goal would be a condition the vendor turns away.
# A turned-away run answers as a success that did nothing, which is worse than a failure.
goal = "/goal The task described in the instructions is finished, its result is committed on the current branch, and git status reports a clean tree."

# How far one run may go before it is cut off.
#
# A guard against one run going nowhere. Not a session's budget, and nothing a session works
# out reaches here: a session measures itself against a meter that reads in whole percent and
# carries usage the session did not cause, and a figure like that is not one to end a task
# with. What ends a run is one of these, or a person.
#
# So these are what every run is held to, whatever a session declared. Raise them where runs
# are meant to be larger.
turns = "200"
spend = "20"

# Arguments are grouped so that a group holding a place nobody filled is dropped whole.
# A task that named no model has to lose --model with it.
#
# The last group is what `answer.reader` below reads. A file laid over this one replaces an
# array whole rather than adding to it, so an `args` that leaves those flags out changes the
# shape of the answer without changing the reader that expects it: runs then finish with
# nothing readable where the usage should be. Override `args` and `answer.reader` together,
# or leave that group in.
args = [
  ["--permission-mode", "bypassPermissions"],
  ["--max-turns", "{turns}"],
  ["--max-budget-usd", "{spend}"],
  ["--model", "{model}"],
  # A task being carried on rather than done over. The group is dropped whole where nothing
  # fills the place, which is every run that starts a conversation of its own.
  ["--resume", "{conversation}"],
  ["--append-system-prompt", "{instruction}"],
  ["-p", "{goal}"],
  ["--output-format", "stream-json", "--verbose"],
]

[answer]
# One object per line, one of which is the answer and the rest the trace.
reader = "last-json-line"

# The name the vendor gives for stopping is what tells a ceiling from a failure.
outcome = "subtype"

# What a run that failed said about itself, when it said anything.
said = "result"

# The conversation the run was in. A run of a task that was cut off left its work in the work
# area and on the branch and its conversation here; naming it back is what lets the next run
# carry it on rather than read all of it again.
conversation = "session_id"

# How many turns it took.
#
# Worth having beside the tokens for two reasons. It is what this vendor is told to hold a run
# to, so it crosses without being converted; and across the runs of a real history the count of
# turns says what a run cost to within a hair -- the log correlation is 0.99 and the relation is
# tokens = 19,600 x turns^1.31. Neither is true of the tokens, which have to be turned into a
# share of a limit by a meter that reads in whole percent.
turns = "num_turns"

# The price, and what to multiply it by to reach millionths of the currency.
cost = "total_cost_usd"
cost_scale = 1000000.0

# The per-model breakdown rather than the run's own `usage`. That one counts only the
# calls that left a message, while the price covers all of them; the same answer shows
# 3182 against 3377. The star adds up every model, since one run may reach for more
# than one.
input = "modelUsage.*.inputTokens"
output = "modelUsage.*.outputTokens"
cache_written = "modelUsage.*.cacheCreationInputTokens"
cache_read = "modelUsage.*.cacheReadInputTokens"

# Which line the answer is on.
#
# The last one written is not always it. A hook of the user's that outlives the run has its
# response written after the answer, which happens whenever the run ends sooner than the hook
# does. Reading the hook's line leaves a run that finished looking like one that reported
# nothing, and the session stops for want of a figure.
[answer.marks]
at = "type"
is = "result"

# A run cut off at a ceiling answers with no text of its own. The word it gives instead
# is all there is to report, so each word carries the sentence to report for it. The
# same places are filled here as in `args`.
[answer.at_ceiling]
error_max_turns = "the agent was cut off after {turns} turns"
# What 2.1.227 answers with for `--max-budget-usd`, checked against it. `error_max_budget` is
# what an earlier one said, and both are kept so that either answers the same way.
error_max_budget_usd = "the agent was cut off at {spend} dollars"
error_max_budget = "the agent was cut off at {spend} dollars"

# How much of the five-hour allowance is left.
#
# The figure is only on the status line, and the status line is only drawn where there is
# a terminal, so this is a session with a terminal attached rather than the one-shot
# invocation above. Nothing of the user's own settings is loaded: those can hold anything,
# and a session that stops to complain about them never draws a status line.
[limit]
reader = "status-line"
program = "claude"
args = [
  ["--settings", "{settings}"],
  ["--setting-sources", "project"],
  ["--model", "haiku"],
]

# What the vendor is given to load, written out as JSON. `{script}` is the program the reader
# wrote, which is the only way the figure leaves the session.
settings = { statusLine = { type = "command", command = "{script}" } }

# Sent once, because the figure is empty until an answer has come back.
prompt = "say ok and nothing else"

# What the screen says at the two moments something has to be typed. These are the
# vendor's words and change when the vendor changes them.
# Matched with the spacing and the case taken out, on both sides, so these are
# written as the screen reads rather than as it arrives.
trusts = "Trust this folder"
ready = "try\""

# The five-hour window. The longer one arrives beside it and is not read. The figure
# crosses as hundredths of a percent, since the vendor writes a fraction that lands a
# hair off a whole number.
used = "rate_limits.five_hour.used_percentage"
used_scale = 100.0
resets_at = "rate_limits.five_hour.resets_at"

# Long enough for a session to start, be trusted, take a prompt, and hear back; shorter
# than a person's patience. A terminal that has finished drawing says nothing until it is
# typed at, which is why the screen is looked at on a timer.
give_up_after = 90
settles_in = 4
between_looks_ms = 200
rows = 40
cols = 120

# What a loose instruction is missing, asked once before a task is registered.
#
# An ask, not a run. The model is handed the instruction and what surrounds it and asked only
# to name a place to work and a check that says the work is done. What it answers is written
# into the instruction and held to the same gate as anything a person typed, so a wrong guess
# is a task turned back rather than a run misspent.
[drafter]
program = "claude"

# The model asked first, and the one asked only where the first found no place.
#
# The first runs before every task a rule could not ready, so it is the cheap one. Raise the
# second as stronger names land.
cheaper = "haiku"
stronger = "sonnet"

# How far one ask may go.
#
# One. This is a question to answer, not work to do: the instruction, the change, the commits and
# the file list are all handed over before it starts, so there is nothing left for it to go and
# look up. More turns than that is an agent loop reading a repository it was already given, which
# costs what running the task costs and answers no better.
turns = "1"

# Grouped as `args` above is: a group holding a place nobody filled is dropped whole.
args = [
  ["-p", "{prompt}"],
  ["--model", "{model}"],
  ["--max-turns", "{turns}"],
]

# The word each part of the answer is read by. They are written into the prompt below as well,
# so changing one changes what is asked and what is read together.
goal = "GOAL"
place = "PLACE"
success = "SUCCESS"
on_failure = "ONFAIL"
why = "WHY"
scope = "SCOPE"

# What is put after a part's word to ask what it was drawn from, what else it could be, and what
# to ask a person about it where nothing settled it.
drawn_from = "-FROM"
others = "-OR"
asks = "-ASK"

# What is asked. Everything after the instruction is what the author was looking at when they
# wrote it: `{changes}` is the change they have open, `{lately}` what they committed before it,
# `{branch}` the branch they are on, `{files}` what the repository tracks.
# What is asked.
#
# What does not change between one task and the next comes first, and what changes comes last.
# A vendor holds what it has already read and charges a tenth for reading it again, and it holds
# it from the front: a prompt that opens with the instruction is one where nothing before the
# instruction can be held, which is all of it. The file list and the commits are the same for
# every task added to a repository in a sitting, so they open it.
prompt = """
You are writing the specification for a coding task that will run unattended. Nobody will be \
there to answer questions once it starts, so anything the specification leaves out is something \
the agent will decide by itself.

Files the repository tracks:
{files}

What was committed lately:
{lately}

The branch they are on: {branch}

Write every value, every question and every choice in the same language the author typed in. \
They will read this, and they wrote to you in their own words. That holds for the answers below \
as much as for the questions: where this asks you for an answer and describes what it should be, \
describe it back to them in their language rather than repeating the description.

Where you cannot settle a part, leave its value empty and write two things instead: a short \
question asking what is missing, and two or three concrete answers to choose between, drawn from \
this repository rather than invented. Never leave a part with no value and no question: an empty \
value with nothing beside it is a person staring at a blank line with nothing to answer.

Write the answers as the answers themselves, ready to be used as the value of that part. Do not \
number them, and do not offer "type your own" among them: that one is offered for you.

Answer with these lines and nothing else.

{goal}: <what the work is, in one sentence>
{goal}{drawn_from}: <the file, line, or commit you read it from>
{goal}{asks}: <a question, if you could not work it out>
{goal}{others}: <two or three answers to choose between, separated by commas>
{place}: <one path that appears in the files above>
{place}{drawn_from}: <why that one>
{place}{others}: <other paths it could be, separated by commas>
{place}{asks}: <a question, if you could not work it out>
{success}: <a command that can be run in this repository and that fails right now>
{success}{drawn_from}: <where you found it>
{success}{asks}: <a question, if you could not find one>
{success}{others}: <two or three commands to choose between>
{on_failure}: <leave this empty, always>
{on_failure}{asks}: <ask what the agent should do when it cannot get there>
{on_failure}{others}: <two or three answers, every one of which stops. Never offer editing or \
deleting a test, changing what the success condition is, or leaving the work unfinished and \
saying it passed: those are how an agent makes a failing check pass without doing the work, and \
offering one is putting it a keystroke away>
{why}: <what goes wrong today, with a file and line>
{why}{drawn_from}: <the file and line>
{why}{asks}: <a question, if you could not work it out>
{why}{others}: <two or three answers to choose between>
{scope}: <what may be changed and what may not>
{scope}{drawn_from}: <why>
{scope}{asks}: <a question, if you could not work it out>
{scope}{others}: <two or three answers to choose between>

The change they have open and uncommitted:
{changes}

What the author typed:
{instruction}

Work out what they meant, from what they were looking at."""

# What is asked the second time, once the repository has been asked about the first answer.
again = """
You wrote a specification and some of it did not hold up against the repository:

{amiss}

Answer again in the same lines, correcting those. Leave a part empty rather than replacing it \
with something else that is not there."""

# What one line of what a run wrote amounts to.
#
# What the agent said and what it reached for, one sentence each. Its thinking is left
# out, being long and addressed to nobody.
[trace]
said = "assistant"
came_back = "user"
blocks = "message.content"
text = "text"
reached_for = "tool_use"
result = "tool_result"
errored = "is_error"

# What a result block holds, what a tool is called, and where its arguments are.
held = "content"
called = "name"
given = "input"

# A tool takes an object of arguments and one of them is what a person would say it acted
# on. The rest is left in the file.
subject = ["command", "pattern", "url", "description"]
subject_path = ["file_path", "path", "notebook_path"]
